<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca EPUB</title>

    <!-- 1. JSZip (Requisito para EPUB) local -->
    <script src="./libs/jszip.min.js"></script>

    <!-- 2. EPUB.js (Visor EPUB) local -->
    <script src="./libs/epub.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .contenedor {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2rem;
            width: 100%;
            max-width: 750px;
        }
        h1 { font-size: 1.5rem; color: #1e293b; text-align: center; margin-top: 0;}
        
        /* Lista de archivos */
        ul#lista-epubs {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul#lista-epubs li {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            gap: 1rem;
        }
        ul#lista-epubs li:hover { background-color: #f8fafc; }
        ul#lista-epubs li:last-child { border-bottom: none; }
        
        .archivo { font-family: monospace; font-size: 0.9rem; word-break: break-word; color: #0f172a; }
        
        a.btn-abrir {
            color: #2563eb; text-decoration: none; font-weight: 500;
            display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer;
            padding: 0.4rem 0.8rem; border-radius: 6px; background: #eff6ff;
            white-space: nowrap; flex-shrink: 0;
        }
        a.btn-abrir:hover { background: #dbeafe; text-decoration: underline; }
        a.btn-abrir::before { content: "📘"; font-size: 1.1rem; }

        .no-archivos { text-align: center; color: #64748b; padding: 1rem; font-size: 0.95rem; }

        /* Modal Base */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
            display: none; justify-content: center; align-items: center;
            padding: 1.5rem; z-index: 1000;
        }
        .modal-overlay.activo { display: flex; }
        
        .modal-contenido {
            background: #fff; border-radius: 12px; width: 100%; max-width: 950px;
            max-height: 90vh; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: max-width 0.3s, max-height 0.3s;
        }

        .modal-contenido.pantalla-completa {
            max-width: 98vw;
            height: 96vh;
            max-height: 96vh;
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; border-bottom: 1px solid #e2e8f0; background: #f8fafc;
        }
        .modal-header h2 { margin: 0; font-size: 1.1rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .cerrar-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b; flex-shrink: 0;}
        .cerrar-btn:hover { color: #0f172a; }
        
        .modal-body { overflow-y: auto; padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .modal-body.epub-mode { padding: 0; overflow: hidden; }

        /* Visor EPUB */
        #epub-viewer { width: 100%; height: 100%; display: none; flex-direction: column; flex: 1; }
        #epub-viewer.activo { display: flex; }
        #epub-area { flex: 1; width: 100%; overflow: hidden; background: #fff;}
        
        /* Controles del EPUB */
        .epub-controls {
            display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem;
            background: #f8fafc; border-top: 1px solid #e2e8f0; flex-wrap: wrap; gap: 0.5rem;
        }
        .epub-nav, .epub-zoom { display: flex; align-items: center; gap: 0.5rem; }
        .epub-controls button { 
            padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 4px; 
            border: 1px solid #cbd5e1; background: #fff; font-weight: 500;
        }
        .epub-controls button:hover { background: #e2e8f0; }
        .epub-controls button:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f5f9; }
        #epubPageInfo { font-size: 0.9rem; color: #64748b; min-width: 80px; text-align: center; }
        #zoomLevel { font-size: 0.9rem; color: #1e293b; min-width: 50px; text-align: center; font-weight: bold;}

        /* Utilidades */
        .cargando { display: none; text-align: center; padding: 2rem; color: #64748b; }
        .error-msg { display: none; background: #fef2f2; color: #b91c1c; padding: 1rem; border-radius: 8px; border: 1px solid #fecaca; margin: 1rem;}
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Biblioteca EPUB</h1>
        <ul id="lista-epubs">
            <li class="no-archivos">Cargando lista de archivos...</li>
        </ul>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="visorOverlay">
        <div class="modal-contenido" id="modalContenido">
            <div class="modal-header">
                <h2 id="visorTitulo">Visor</h2>
                <button class="cerrar-btn" id="cerrarVisor">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                
                <div id="epub-viewer">
                    <div id="epub-area"></div>
                    <div class="epub-controls">
                        <div class="epub-nav">
                            <button id="epubPrev" disabled>◀ Anterior</button>
                            <span id="epubPageInfo">—</span>
                            <button id="epubNext" disabled>Siguiente ▶</button>
                        </div>
                        <div class="epub-zoom">
                            <button id="zoomOut" title="Alejar">➖</button>
                            <span id="zoomLevel">100%</span>
                            <button id="zoomIn" title="Acercar">➕</button>
                        </div>
                    </div>
                </div>

                <div id="mensajeVisor" class="cargando">Cargando EPUB...</div>
                <div id="errorVisor" class="error-msg"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CARGAR Y GENERAR LA LISTA DESDE JSON
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            const listaUl = document.getElementById('lista-epubs');
            
            try {
                const response = await fetch('libros.json');
                if (!response.ok) throw new Error('No se encontró libros.json');
                
                const libros = await response.json();

                listaUl.innerHTML = ''; 

                if (libros.length === 0) {
                    listaUl.innerHTML = '<li class="no-archivos">No hay libros en la lista.</li>';
                    return;
                }

                libros.forEach(libro => {
                    const li = document.createElement('li');
                    
                    const spanNombre = document.createElement('span');
                    spanNombre.className = 'archivo';
                    spanNombre.textContent = libro.titulo;
                    
                    const enlace = document.createElement('a');
                    enlace.href = '#';
                    enlace.className = 'btn-abrir';
                    enlace.textContent = 'Abrir';
                    
                    enlace.addEventListener('click', (e) => {
                        e.preventDefault();
                        abrirVisor(libro.url, libro.titulo);
                    });

                    li.appendChild(spanNombre);
                    li.appendChild(enlace);
                    listaUl.appendChild(li);
                });

            } catch (error) {
                console.error(error);
                listaUl.innerHTML = '<li class="no-archivos" style="color:#b91c1c">Error: Asegúrate de tener un archivo "libros.json" válido y de estar usando un servidor local.</li>';
            }
        });

        // ==========================================
        // 2. LÓGICA DEL VISOR Y EL MODAL
        // ==========================================
        (function () {
            const overlay = document.getElementById('visorOverlay');
            const modalContenido = document.getElementById('modalContenido');
            const modalBody = document.getElementById('modalBody');
            const titulo = document.getElementById('visorTitulo');
            const epubViewer = document.getElementById('epub-viewer');
            const epubArea = document.getElementById('epub-area');
            const epubPrev = document.getElementById('epubPrev');
            const epubNext = document.getElementById('epubNext');
            const epubPageInfo = document.getElementById('epubPageInfo');
            
            const zoomIn = document.getElementById('zoomIn');
            const zoomOut = document.getElementById('zoomOut');
            const zoomLevel = document.getElementById('zoomLevel');
            let currentFontSize = 100;

            const mensaje = document.getElementById('mensajeVisor');
            const errorDiv = document.getElementById('errorVisor');

            let currentEpub = null;
            let currentRendition = null;
            let currentLibroId = null; // Para guardar el estado de lectura

            window.abrirVisor = function(archivoUrl, archivoTitulo) {
                overlay.classList.add('activo');
                destruirEpub();
                
                modalContenido.classList.add('pantalla-completa');
                modalBody.classList.add('epub-mode');
                
                titulo.textContent = archivoTitulo;
                epubViewer.classList.add('activo');

                mensaje.style.display = 'block';
                mensaje.textContent = 'Cargando EPUB...';
                errorDiv.style.display = 'none';

                currentFontSize = 100;
                zoomLevel.textContent = '100%';
                
                // Identificador único para el localStorage (usamos la URL)
                currentLibroId = `epub_last_pos_${archivoUrl}`;

                try {
                    currentEpub = ePub(archivoUrl);

                    currentEpub.ready.then(() => {
                        mensaje.style.display = 'none';
                        currentRendition = currentEpub.renderTo(epubArea, {
                            width: '100%', height: '100%', spread: 'none', flow: 'paginated'
                        });

                        // --- RECUPERAR POSICIÓN GUARDADA ---
                        const posicionGuardada = localStorage.getItem(currentLibroId);
                        
                        if (posicionGuardada) {
                            // Si hay una posición guardada, abrimos ahí
                            return currentRendition.display(posicionGuardada);
                        } else {
                            // Si no, abrimos desde el principio
                            return currentRendition.display();
                        }

                    }).then(() => {
                        actualizarBotonesEpub();
                        currentRendition.on('rendered', () => applyZoom());
                    }).catch(err => {
                        console.error(err);
                        mostrarError('Error al cargar el EPUB. Verifica que el archivo exista.');
                    });

                    currentEpub.ready.then(() => {
                        if (!currentRendition) return;
                        
                        // --- GUARDAR POSICIÓN AL CAMBIAR DE PÁGINA ---
                        currentRendition.on('relocated', function (location) {
                            const d = location.start.displayed;
                            epubPageInfo.textContent = d ? `Pág ${d.page} / ${d.total}` : `${Math.round(location.start.percentage*100)}%`;
                            actualizarBotonesEpub();

                            // Guardamos el CFI (la "dirección" exacta dentro del libro)
                            if (location && location.start && location.start.cfi) {
                                localStorage.setItem(currentLibroId, location.start.cfi);
                            }
                        });
                    });

                } catch (e) {
                    mostrarError('Error inicializando EPUB: ' + e.message);
                }
            };

            function mostrarError(msg) {
                mensaje.style.display = 'none';
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            }

            function destruirEpub() {
                if (currentRendition) { try { currentRendition.destroy(); } catch(e){} currentRendition = null; }
                if (currentEpub) { try { currentEpub.destroy(); } catch(e){} currentEpub = null; }
                epubArea.innerHTML = '';
                currentLibroId = null;
            }

            function cerrarVisor() {
                overlay.classList.remove('activo');
                destruirEpub();
                modalContenido.classList.remove('pantalla-completa');
                modalBody.classList.remove('epub-mode');
                epubViewer.classList.remove('activo');
            }

            // --- CONTROLES DE ZOOM ---
            function applyZoom() {
                if (currentRendition) {
                    currentRendition.themes.fontSize(`${currentFontSize}%`);
                }
            }

            zoomIn.addEventListener('click', () => {
                if (currentFontSize < 250) {
                    currentFontSize += 10;
                    zoomLevel.textContent = `${currentFontSize}%`;
                    applyZoom();
                }
            });

            zoomOut.addEventListener('click', () => {
                if (currentFontSize > 50) {
                    currentFontSize -= 10;
                    zoomLevel.textContent = `${currentFontSize}%`;
                    applyZoom();
                }
            });

            // --- NAVEGACIÓN ---
            function actualizarBotonesEpub() {
                if (!currentRendition) return;
                const loc = currentRendition.currentLocation();
                if (loc && loc.start) {
                    epubPrev.disabled = loc.start.atStart;
                    epubNext.disabled = loc.start.atEnd;
                }
            }

            epubPrev.addEventListener('click', () => { if(currentRendition) currentRendition.prev().then(actualizarBotonesEpub); });
            epubNext.addEventListener('click', () => { if(currentRendition) currentRendition.next().then(actualizarBotonesEpub); });

            // --- EVENTOS DE CIERRE ---
            document.getElementById('cerrarVisor').addEventListener('click', cerrarVisor);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrarVisor(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('activo')) cerrarVisor(); });

        })();
    </script>
</body>
</html>
